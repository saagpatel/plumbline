[project]
name = "plumbline"
version = "0.2.0"
description = "Open, OTel-compatible agent-trace schema + offline decision-path recorder/scorer for coding-agent harnesses"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
# The recorder core is intentionally zero-runtime-dependency (pure stdlib) so it
# is trivial to embed in any harness. Validation/test tooling lives in groups.
dependencies = []

# Opt-in extra: the reference Anthropic judge backend. The core never imports it;
# `pip install plumbline[judge]` enables scorer.judge.AnthropicBackend.
[project.optional-dependencies]
judge = ["anthropic"]

[project.scripts]
plumbline = "plumbline.cli:main"

[build-system]
requires = ["uv_build"]
build-backend = "uv_build"

[dependency-groups]
dev = [{ include-group = "lint" }, { include-group = "test" }]
lint = ["ruff", "ty"]
test = ["pytest", "pytest-cov", "jsonschema"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  "D",      # docstring rules — not enforced for this codebase
  "COM812", # trailing comma (formatter owns this)
  "ISC001", # implicit string concat (formatter owns this)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "PLR2004", "ANN", "INP001"]

[tool.pytest.ini_options]
addopts = "-q --cov=plumbline --cov-report=term-missing --cov-fail-under=80"
testpaths = ["tests"]

[tool.ty.environment]
python-version = "3.11"

[tool.ty.rules]
# The Anthropic judge backend is an optional extra: `anthropic` is unresolved in
# the zero-dep / CI env (so the inline `ty: ignore` is needed there) but resolved
# once `plumbline[judge]` is installed (so the same ignore reads as unused). Don't
# flag the conditionally-needed suppression either way.
unused-ignore-comment = "ignore"
